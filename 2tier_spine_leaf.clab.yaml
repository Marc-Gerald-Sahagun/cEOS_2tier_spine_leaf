name: 2tier
prefix: ""
mgmt:
  network: clabs
  ipv4-subnet: 10.0.20.0/24
settings: null
topology:
  defaults:
    env:
      INTFTYPE: et
  kinds:
    arista_ceos:
      image: ceos:4.32.0F
    linux:
      image: alpine:latest
  nodes:
    leaf1:
      kind: arista_ceos
      group: leaf
      mgmt-ipv4: 10.0.20.101
      startup-config: configs/leaf1.cfg
    leaf2:
      kind: arista_ceos
      group: leaf
      mgmt-ipv4: 10.0.20.102
      startup-config: configs/leaf2.cfg
    leaf3:
      kind: arista_ceos
      group: leaf
      mgmt-ipv4: 10.0.20.103
      startup-config: configs/leaf3.cfg
    leaf4:
      kind: arista_ceos
      group: leaf
      mgmt-ipv4: 10.0.20.104
      startup-config: configs/leaf4.cfg
    leaf5:
      kind: arista_ceos
      group: leaf
      mgmt-ipv4: 10.0.20.105
      startup-config: configs/leaf5.cfg
    leaf6:
      kind: arista_ceos
      group: leaf
      mgmt-ipv4: 10.0.20.106
      startup-config: configs/leaf6.cfg
    spine1:
      kind: arista_ceos
      group: spine
      mgmt-ipv4: 10.0.20.107
      startup-config: configs/spine1.cfg
    spine2:
      kind: arista_ceos
      group: spine
      mgmt-ipv4: 10.0.20.108
      startup-config: configs/spine2.cfg
    server1:
      kind: linux
      group: server
      mgmt-ipv4: 10.0.20.109
      exec:
        - ip link add bond0 type bond # create an empty bond named bond0
        - sh -c 'echo 802.3ad > /sys/class/net/bond0/bonding/mode' # set the bond to LACP mode (must happen while the bond has no members)
        - sh -c 'echo 100 > /sys/class/net/bond0/bonding/miimon' # detects if link has failed every 100 miliseconds 
        - ip link set eth1 down # shutdown interface eth1 (must be done before a port can enter a bond)
        - ip link set eth2 down # shutdown interface eth2 (must be done before a port can enter a bond)
        - ip link set eth1 master bond0 # add eth1 to bond0
        - ip link set eth2 master bond0 # add eth 2 to bond0
        - ip link set bond0 up # brings bond0 interface up
        - ip route del default via 10.0.20.1 dev eth0 # deletes the management gateway so the frabic gateway is the only default
        - udhcpc -i bond0 # enables bond0 to receive IP address from DHCP server
    server2:
      kind: linux
      group: server
      mgmt-ipv4: 10.0.20.110
      exec:  
        - ip link add bond0 type bond
        - sh -c 'echo 802.3ad > /sys/class/net/bond0/bonding/mode'
        - sh -c 'echo 100 > /sys/class/net/bond0/bonding/miimon'
        - ip link set eth1 down
        - ip link set eth2 down
        - ip link set eth1 master bond0
        - ip link set eth2 master bond0
        - ip link set bond0 up
        - ip route del default via 10.0.20.1 dev eth0
        - udhcpc -i bond0
    server3:
      kind: linux
      group: server
      mgmt-ipv4: 10.0.20.111
      exec:  
        - ip link add bond0 type bond
        - sh -c 'echo 802.3ad > /sys/class/net/bond0/bonding/mode'
        - sh -c 'echo 100 > /sys/class/net/bond0/bonding/miimon'
        - ip link set eth1 down
        - ip link set eth2 down
        - ip link set eth1 master bond0
        - ip link set eth2 master bond0
        - ip link set bond0 up
        - ip route del default via 10.0.20.1 dev eth0
        - udhcpc -i bond0
    server4:
      kind: linux
      group: server
      mgmt-ipv4: 10.0.20.112
      exec:  
        - ip link add bond0 type bond
        - sh -c 'echo 802.3ad > /sys/class/net/bond0/bonding/mode'
        - sh -c 'echo 100 > /sys/class/net/bond0/bonding/miimon'
        - ip link set eth1 down
        - ip link set eth2 down
        - ip link set eth1 master bond0
        - ip link set eth2 master bond0
        - ip link set bond0 up
        - ip route del default via 10.0.20.1 dev eth0 
        - udhcpc -i bond0
  links:
    # link between spine1 and all leafs 
    - endpoints: [ "spine1:et1", "leaf1:et1" ]
    - endpoints: [ "spine1:et2", "leaf2:et1" ]
    - endpoints: [ "spine1:et3", "leaf3:et1" ]
    - endpoints: [ "spine1:et4", "leaf4:et1" ]
    - endpoints: [ "spine1:et5", "leaf5:et1" ]
    - endpoints: [ "spine1:et6", "leaf6:et1" ]

    # link between spine2 and all leafs
    - endpoints: [ "spine2:et1", "leaf1:et2" ]
    - endpoints: [ "spine2:et2", "leaf2:et2" ]
    - endpoints: [ "spine2:et3", "leaf3:et2" ]
    - endpoints: [ "spine2:et4", "leaf4:et2" ]
    - endpoints: [ "spine2:et5", "leaf5:et2" ]
    - endpoints: [ "spine2:et6", "leaf6:et2" ]

    # link between the leafs (EXCEPTION: THIS ONLY FOR MLAG PAIRS)
    - endpoints: [ "leaf1:et4", "leaf2:et4" ]
    - endpoints: [ "leaf3:et4", "leaf4:et4" ]

    # link between servers and leafs
      # server 1 to both leaf 1 and 2
    - endpoints: [ "server1:eth1", "leaf1:et3" ]
    - endpoints: [ "server1:eth2", "leaf2:et3" ]
      # server 2 to both leaf 3 and 4 
    - endpoints: [ "server2:eth1", "leaf3:et3" ]
    - endpoints: [ "server2:eth2", "leaf4:et3" ]
      # server 3 to leaf 5
    - endpoints: [ "server3:eth1", "leaf5:et3" ]
    - endpoints: [ "server3:eth2", "leaf5:et4" ]
      # server 4 to leaf 6
    - endpoints: [ "server4:eth1", "leaf6:et3" ]
    - endpoints: [ "server4:eth2", "leaf6:et4" ]

